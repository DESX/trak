name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov=trak --cov-report=term-missing --cov-fail-under=90

  go:
    name: go ${{ matrix.go }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [stable, oldstable]
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go/go.sum
      - run: go vet ./...
      - run: go test -race ./...
        if: runner.os != 'Windows'
      - run: go test ./...
        if: runner.os == 'Windows'
      - uses: dominikh/staticcheck-action@v1
        if: runner.os == 'Linux' && matrix.go == 'stable'
        with:
          working-directory: go
          install-go: false

  cpp:
    name: c++ ${{ matrix.compiler }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, compiler: gcc, cxx: g++ }
          - { os: ubuntu-latest, compiler: clang, cxx: clang++ }
          - { os: macos-latest, compiler: clang, cxx: clang++ }
          - { os: windows-latest, compiler: msvc, cxx: cl }
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DTRAK_WERROR=ON
        if: runner.os != 'Windows'
      - name: Configure (MSVC)
        run: cmake -S cpp -B cpp/build -DTRAK_WERROR=ON
        if: runner.os == 'Windows'
      - run: cmake --build cpp/build --config Release --parallel
      - run: ctest --test-dir cpp/build -C Release --output-on-failure

  cpp-sanitize:
    name: c++ asan+ubsan / ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: gcc, cxx: g++ }
          - { compiler: clang, cxx: clang++ }
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DTRAK_WERROR=ON -DTRAK_SANITIZE=ON
      - run: cmake --build cpp/build --parallel
      - run: ctest --test-dir cpp/build --output-on-failure
