name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: go ${{ matrix.go }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [stable, oldstable]
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go/go.mod
      - run: go vet ./...
      - run: go test -race ./...
        if: runner.os != 'Windows'
      - run: go test ./...
        if: runner.os == 'Windows'
      - uses: dominikh/staticcheck-action@v1
        if: runner.os == 'Linux' && matrix.go == 'stable'
        with:
          working-directory: go
          install-go: false
      - name: The embedded viewer matches viewer/ and js/src
        if: runner.os == 'Linux' && matrix.go == 'stable'
        run: |
          cd cmd/trak && go generate
          git diff --exit-code -- .
          test -z "$(git status --porcelain -- .)"
      - name: Fuzz
        if: runner.os == 'Linux' && matrix.go == 'stable'
        run: go test -run '^$' -fuzz '^FuzzRead$' -fuzztime 60s .
      - name: A 200 MB Sophie file passes check, under each policy
        if: runner.os == 'Linux' && matrix.go == 'stable'
        run: |
          for p in reference delta; do
            go run ./cmd/sophie-gen -q --size 200MB --seed 1 --policy $p "$RUNNER_TEMP/s-$p.trak"
            go run ./cmd/trak check "$RUNNER_TEMP/s-$p.trak"
          done

  js:
    name: javascript / node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [18, 20, 22]
        include:
          - { os: macos-latest, node: 22 }
          - { os: windows-latest, node: 22 }
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: node --test test/conformance.test.js test/reader.test.js

  viewer:
    name: viewer end-to-end (headless Chromium)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer/test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: go/go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Shared runners are slower and noisier than a desk: time, but don't fail on, the targets.
      - run: npm test
        env:
          TRAK_STRICT: "0"
          TRAK_PERF_OUT: perf.json
      - uses: actions/upload-artifact@v5
        with:
          name: viewer-perf
          path: viewer/test/perf.json

  license:
    name: license copies match
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cmp LICENSE go/LICENSE
