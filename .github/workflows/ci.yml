name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov=trak --cov-report=term-missing --cov-fail-under=90
        env:
          # Full-size runs (1M-event bounds file, VLQ round trip to 10^7) on one job.
          TRAK_SLOW: ${{ matrix.os == 'ubuntu-latest' && matrix.python == '3.12' && '1' || '' }}

  conformance:
    name: conformance vectors are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e "python[dev]"
      - run: python conformance/generate.py
      - run: git diff --exit-code -- conformance
      - run: ruff check conformance && ruff format --check conformance
      - name: License copies match
        run: cmp LICENSE python/LICENSE && cmp LICENSE go/LICENSE

  go:
    name: go ${{ matrix.go }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [stable, oldstable]
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go/go.sum
      - run: go vet ./...
      - run: go test -race ./...
        if: runner.os != 'Windows'
      - run: go test ./...
        if: runner.os == 'Windows'
      - uses: dominikh/staticcheck-action@v1
        if: runner.os == 'Linux' && matrix.go == 'stable'
        with:
          working-directory: go
          install-go: false
      - name: The embedded viewer matches viewer/ and js/src
        if: runner.os == 'Linux' && matrix.go == 'stable'
        run: |
          cd cmd/trak && go generate
          git diff --exit-code -- .
          test -z "$(git status --porcelain -- .)"
      - name: Fuzz
        if: runner.os == 'Linux' && matrix.go == 'stable'
        run: |
          go test -run '^$' -fuzz '^FuzzReader$' -fuzztime 30s .
          go test -run '^$' -fuzz '^FuzzSchemaParser$' -fuzztime 30s .

  js:
    name: javascript / node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [18, 20, 22]
        include:
          - { os: macos-latest, node: 22 }
          - { os: windows-latest, node: 22 }
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: node --test test/conformance.test.js test/reader.test.js

  viewer:
    name: viewer end-to-end (headless Chromium)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer/test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: go/go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  cpp:
    name: c++ ${{ matrix.compiler }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, compiler: gcc, cxx: g++ }
          - { os: ubuntu-latest, compiler: clang, cxx: clang++ }
          - { os: macos-latest, compiler: clang, cxx: clang++ }
          - { os: windows-latest, compiler: msvc, cxx: cl }
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DTRAK_WERROR=ON
        if: runner.os != 'Windows'
      - name: Configure (MSVC)
        run: cmake -S cpp -B cpp/build -DTRAK_WERROR=ON
        if: runner.os == 'Windows'
      - run: cmake --build cpp/build --config Release --parallel
      - run: ctest --test-dir cpp/build -C Release --output-on-failure

  cpp-sanitize:
    name: c++ asan+ubsan / ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: gcc, cxx: g++ }
          - { compiler: clang, cxx: clang++ }
    steps:
      - uses: actions/checkout@v5
      - run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DTRAK_WERROR=ON -DTRAK_SANITIZE=ON
      - run: cmake --build cpp/build --parallel
      - run: ctest --test-dir cpp/build --output-on-failure

  cpp-tidy:
    name: c++ clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install clang-tidy==18.1.8
      - run: cmake -S cpp -B cpp/build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DTRAK_BUILD_TESTS=OFF
      - run: clang-tidy -p cpp/build cpp/src/*.cpp

  cpp-fuzz:
    name: c++ libFuzzer (short run)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - run: cmake -S cpp -B cpp/build -DCMAKE_CXX_COMPILER=clang++ -DTRAK_BUILD_TESTS=OFF -DTRAK_BUILD_FUZZERS=ON
      - run: cmake --build cpp/build --target trak_fuzz_reader --parallel
      # Valid and write vectors share names, so prefix each file with its directory.
      - run: mkdir -p corpus && for f in conformance/*/*.trak; do cp "$f" "corpus/$(basename "$(dirname "$f")")-$(basename "$f")"; done
      - run: cpp/build/trak_fuzz_reader -max_total_time=60 -timeout=10 corpus

  cross:
    name: cross-implementation / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: go/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: pip install -e python
      - run: cd go && go build -o interop$(go env GOEXE) ./internal/interop
      - run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build cpp/build --config Release --target trak_interop --parallel
      - name: Cross-check
        run: |
          cpp=cpp/build/trak_interop
          if [ -f cpp/build/Release/trak_interop.exe ]; then cpp=cpp/build/Release/trak_interop.exe; fi
          python conformance/crosscheck.py --seeds 200 \
            --impl python="python python/tests/interop.py" \
            --impl go=go/interop$(cd go && go env GOEXE) \
            --impl cpp=$cpp \
            --reader js="node js/tools/interop.js"

  readme:
    name: README quickstarts run as written
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: go/go.sum
      - run: python docs/check_readme.py
