name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  go-tag:
    name: tag the Go module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Push go/${{ github.ref_name }}
        run: |
          git tag "go/${GITHUB_REF_NAME}" "${GITHUB_SHA}"
          git push origin "go/${GITHUB_REF_NAME}"

  cli:
    name: trak CLI ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: go/go.sum
      - name: Build
        working-directory: go
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          name="trak-${GITHUB_REF_NAME}-${GOOS}-${GOARCH}${ext}"
          go build -trimpath -ldflags "-s -w" -o "../dist/${name}" ./cmd/trak
      - uses: actions/upload-artifact@v5
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  python:
    name: build Python distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build python --outdir dist
      - uses: actions/upload-artifact@v5
        with:
          name: python-dist
          path: dist/*

  pypi:
    name: publish to PyPI
    needs: [python]
    runs-on: ubuntu-latest
    # Trusted publishing: configure the `pypi` environment and this workflow on
    # pypi.org before the first release.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    needs: [cli, python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^(## )?\[/ {exit} on' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "trak ${GITHUB_REF_NAME}" --notes-file notes.md
