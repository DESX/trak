[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trak-log"
version = "1.1.0"
description = "Reference library for trak, a log format that programs write and read, and people can read too."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "hypothesis", "mypy", "ruff"]

[project.urls]
Homepage = "https://github.com/desx/trak"

[tool.hatch.build.targets.wheel]
packages = ["src/trak"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
